name: Docker Build & Push

# This Action will:
# - Build a Dockerfile located in the root of the project.
# - Push the new docker image in an ECR Registry.
# - Update a task definition with the new docker image tag.

# ##### GITHUB REQUIRED VARS #####
# AWS_DEFAULT_REGION: Already available in all /gsoftcolombia projects.
# AWS_ROLE_TO_ASSUME: ARN of the role that aws-actions can assume.
# REPO_NAME: ECR Repository Name
# APP_NAME_PREFIX: Prefix of the task definition in AWS.
# APP_NAME_SUFFIX: Suffix/Postfix of the task definition in AWS. 
#   - If there are multiple task-definitions you can add them separated by ';' e.g. customers;products
#   - If the Action is executed from Main, it expects to update a task definition
#     with the name {APP_NAME_PREFIX}-prod-{APP_NAME_SUFFIX}
#     otherwise, {APP_NAME_PREFIX}-dev-{APP_NAME_SUFFIX}

# ##### USAGE TEMPLATE #####
# on:
#   push:
#     branches:
#     - main
#   pull_request:
#     branches:
#     - main
# 
# jobs:
#   build-push:
#     uses: gsoftcolombia/github-actions/.github/workflows/docker-build-upload.yml@main

on:
  workflow_call:

jobs:
  build-push:
    name: Build, Push Docker image and Update Task Definition
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./

    steps:
      - name: Checkout the repository to the runner
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set short git commit SHA
        id: vars
        run: |
          PR_SHA=${{ github.event.pull_request.head.sha }}
          GITHUB_SHA=${{ github.sha }}
          COMMIT_SHA="${PR_SHA:-$GITHUB_SHA}"
          calculatedSha=$(git rev-parse --short ${COMMIT_SHA})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV
    
      - name: Build and Push to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.REPO_NAME }}
        run: |
          IMAGE_ENV=$([ "$GITHUB_REF" = "refs/heads/main" ] && echo "prod" || echo "dev")
          IMAGE_TAG="${IMAGE_ENV}-${COMMIT_SHORT_SHA}"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "FULL_IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update ECS Tasks
        run: |
          TASK_ENV=$([ "$GITHUB_REF" = "refs/heads/main" ] && echo "prod" || echo "dev")
          
          echo "Updating Task Definitions"
          export IFS=";"
          SUFFIXES="${{ vars.APP_NAME_SUFFIX }}"
          for app in $SUFFIXES; do
            if ! aws ecs describe-task-definition \
              --task-definition ${{ vars.APP_NAME_PREFIX }}-$TASK_ENV-${app} \
              --region=${{ vars.AWS_DEFAULT_REGION }} &> /dev/null; then
              echo "WARNING: Task definition $TASK_DEFINITION does not exist."
            else
              echo "Updating Task-Definition for: ${app} ..."
              TASK_DEFINITION=$(aws ecs describe-task-definition --task-definition ${{ vars.APP_NAME_PREFIX }}-$TASK_ENV-${app} --region=${{ vars.AWS_DEFAULT_REGION }})
              NEW_TASK_DEFINTIION=$(echo $TASK_DEFINITION | jq --arg IMAGE "$FULL_IMAGE_URI" '.taskDefinition | .containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn) | del(.revision) | del(.status) | del(.requiresAttributes) | del(.compatibilities) | del(.registeredAt) | del(.registeredBy)')
              aws ecs register-task-definition --region ${{ vars.AWS_DEFAULT_REGION }} --cli-input-json "$NEW_TASK_DEFINTIION"
            fi
          done

      - name: Render Amazon ECS Service Task Definition
        id: render-web-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:          
          task-definition-family: gs-saas-dev-lubri-sgc
          container-name: gs-saas-dev-lubri-sgc
          image: ${{ env.FULL_IMAGE_URI }}

      - name: Generate appspec.yaml dynamically
        id: generate-appspec
        run: |
          cat <<EOF > appspec.yaml
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: "gs-saas-dev-lubri-sgc"
                  LoadBalancerInfo:
                    ContainerName: "gs-saas-dev-lubri-sgc"
                    ContainerPort: 80
          EOF
          # Optionally, print it for debugging
          cat appspec.yaml

      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web-container.outputs.task-definition }}
          service: gs-saas-dev-lubri-sgc
          cluster: gs-saas-ecs-cluster
          wait-for-service-stability: true
          #codedeploy-appspec: appspec.json
          codedeploy-application: gs-saas-dev-lubri-sgc
          codedeploy-deployment-group: gs-saas-dev-lubri-sgc

